# sources.yaml — 資料來源盤點與介接設定（議題一交付物之機器可讀版本）
#
# 每個來源由 services/ingest 之 Connector 實作，設定驅動而非寫死。
# tier: 1=主來源 2=備援 3=參考
# status: ready = 連接器已實作；planned = 待建（對應架構書 C1–C3）

defaults:
  request_timeout_s: 30
  # publication_lag_s：來源「觀測時刻」到「實際可取得」的典型延遲。
  # 回填歷史資料時用它推算 ingest_time，讓 as_of 回放具有意義（見 --backfill）。
  publication_lag_s: 3600
  retry: {attempts: 3, backoff_s: 5}
  raw_landing: true          # 先原封落地再解析（解析錯誤可重跑，不需重抓）

sources:
  # ── 已具備（複用 Sat_TraingDataExtension A3/A4/A5）──────────────────────
  - source_id: celestrak_sw_all
    name: CelesTrak Space Weather (CSSI SW-All)
    connector: celestrak_sw
    tier: 1
    attribution:
      provider: 'CelesTrak（Dr. T.S. Kelso）'
      product: 'CelesTrak Space Weather Data；原始資料源自 NOAA SWPC 與 GFZ Potsdam'
      url: 'https://celestrak.org/SpaceData/'
      terms: '免費公開；使用時請標註 CelesTrak'
    status: ready
    provides: [F107_OBS, F107_ADJ, F107_OBS_C81, F107_ADJ_C81, F107_OBS_L81,
               F107_ADJ_L81, F107_Q, ISN, CP, C9, KP_3H, AP_3H, AP_AVG]
    cadence_s: 86400
    latency_budget_s: 172800
    endpoint: https://celestrak.org/SpaceData/SW-Last5Years.txt
    format: cssi_txt
    # 離線或封閉環境時改讀本地檔（tools/bootstrap_seed.py 會放置於此）
    local_fallback: data/seed/SW-All.txt
    data_types: [OBS, PRD, PRM]     # PRM 為月預測，可延伸至數十年
    fallback: [gfz_nowcast]
    notes: >
      與 Sat_TraingDataExtension/space_weather_ap.csv 同源（該檔為此來源之 CSV 序列化，
      涵蓋 2021-01-01→2041-10-01）。此來源同時是 STK CSSI 匯入檔的資料本體。
    publication_lag_s: 86400

  - source_id: gfz_nowcast
    name: GFZ Potsdam Kp/ap nowcast
    connector: gfz_nowcast
    tier: 2
    attribution:
      provider: 'GFZ German Research Centre for Geosciences'
      product: 'GFZ Potsdam Kp/ap/Ap/SN/F10.7 nowcast'
      url: 'https://kp.gfz-potsdam.de/'
      terms: 'CC BY 4.0；引用 Matzka et al. (2021), Space Weather'
    status: ready
    provides: [KP_3H, AP_3H, F107_OBS, ISN]
    cadence_s: 10800
    latency_budget_s: 21600
    endpoint: https://kp.gfz-potsdam.de/app/files/Kp_ap_Ap_SN_F107_nowcast.txt
    format: gfz_fixed
    local_fallback: data/seed/gfz_nowcast.txt
    notes: 複用 Sat_TraingDataExtension/data/space_weather/fetch_space_weather.py 之解析邏輯。
    publication_lag_s: 3600

  # ── 新建 C1：NOAA SWPC 即時通道 ────────────────────────────────────────
  - source_id: swpc_xray
    name: NOAA SWPC GOES X-ray flux
    connector: swpc_json
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'GOES XRS 軟 X 射線通量'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [XRAY_LONG, XRAY_SHORT]
    cadence_s: 60
    latency_budget_s: 900
    endpoint: https://services.swpc.noaa.gov/json/goes/primary/xrays-6-hour.json
    format: swpc_energy_json
    publication_lag_s: 300

  - source_id: swpc_solarwind_mag
    name: NOAA SWPC DSCOVR magnetometer (RTSW)
    connector: swpc_json
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'DSCOVR/ACE 即時太陽風磁場（RTSW）'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [IMF_BZ, IMF_BT]
    cadence_s: 60
    latency_budget_s: 900
    endpoint: https://services.swpc.noaa.gov/json/rtsw/rtsw_mag_1m.json
    format: swpc_object_json
    window_h: 48          # RTSW 檔含長歷史（數 MB），例行擷取只取近 48 小時
    publication_lag_s: 300

  - source_id: swpc_solarwind_plasma
    name: NOAA SWPC DSCOVR plasma (RTSW)
    connector: swpc_json
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'DSCOVR/ACE 即時太陽風電漿（RTSW）'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [SW_V, SW_N, SW_T]
    cadence_s: 60
    latency_budget_s: 900
    endpoint: https://services.swpc.noaa.gov/json/rtsw/rtsw_wind_1m.json
    format: swpc_object_json
    window_h: 48
    publication_lag_s: 300

  - source_id: swpc_kp_estimated
    name: NOAA SWPC estimated planetary K index
    connector: swpc_json
    tier: 2
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: '行星際 Kp 估計值（1 分鐘）'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [KP_3H]
    cadence_s: 10800
    latency_budget_s: 14400
    endpoint: https://services.swpc.noaa.gov/json/planetary_k_index_1m.json
    format: swpc_object_json
    publication_lag_s: 1800

  - source_id: swpc_protons
    name: NOAA SWPC GOES integral protons
    connector: swpc_json
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'GOES 積分質子通量'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [PROT10]
    cadence_s: 300
    latency_budget_s: 1800
    endpoint: https://services.swpc.noaa.gov/json/goes/primary/integral-protons-6-hour.json
    format: swpc_energy_json
    publication_lag_s: 600

  - source_id: swpc_xray_flares
    name: NOAA SWPC GOES X-ray flare events
    connector: swpc_solar
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'GOES X 射線閃焰事件表'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [FLARE_PEAK, FLARE_DURATION]
    cadence_s: 60
    latency_budget_s: 3600
    endpoint: https://services.swpc.noaa.gov/json/goes/primary/xray-flares-7-day.json
    format: swpc_flare_json
    notes: >
      GOES 判定之離散閃焰事件（begin/max/end 時間與 A–X 分級），直接對應事件卡時間軸。
      注意閃焰之 X 射線以光速抵達（約 8 分 20 秒），本質上無預警空間，只能即時偵測。
    publication_lag_s: 1800

  - source_id: swpc_solar_regions
    name: NOAA SWPC solar active regions
    connector: swpc_solar
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: '太陽活動區與 M/X 級閃焰機率'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [AR_COUNT, AR_AREA_TOTAL, M_FLARE_PROB, X_FLARE_PROB]
    cadence_s: 86400
    latency_budget_s: 172800
    endpoint: https://services.swpc.noaa.gov/json/solar_regions.json
    format: swpc_solar_regions_json
    notes: >
      含黑子分類、磁分類與 M/X 級閃焰機率。機率欄位是議題三少數現成可用的預報因子
      （來源即預報，故 data_type=PRD）。取代 Sat_TraingDataExtension 之靜態
      space_weather_history.db/solar_regions（A6）。
    publication_lag_s: 86400

  - source_id: gfz_hp30
    name: GFZ Hp30 / ap30 high-cadence geomagnetic index
    connector: geomag_sources
    tier: 1
    attribution:
      provider: 'GFZ German Research Centre for Geosciences'
      product: 'GFZ Potsdam Hp30/ap30 高解析地磁指數'
      url: 'https://kp.gfz-potsdam.de/en/hp30-hp60'
      terms: 'CC BY 4.0；引用 Yamazaki et al. (2022), Space Weather'
    status: ready
    provides: [HP30, AP30]
    cadence_s: 1800
    latency_budget_s: 7200
    publication_lag_s: 1800
    endpoint: https://www-app3.gfz-potsdam.de/kp_index/Hp30_ap30_complete_series.txt
    format: gfz_hp30_txt
    window_days: 120              # 全檔含 1985 年起逾 70 萬列，例行只解析近期
    notes: >
      Kp 為 3 小時值，暴起始時刻會被糊掉 1–2 小時；「提前量」是構想書明列的 KPI，
      用 3 小時解析度量測 1 小時等級的提前量並不合理。Hp30 把解析度提高 6 倍。

  - source_id: swpc_ovation
    name: NOAA SWPC OVATION auroral oval
    connector: geomag_sources
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'OVATION Prime 極光橢圓機率模式'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [AURORA_BOUNDARY_LAT, AURORA_MAX_PROB]
    cadence_s: 1800
    latency_budget_s: 7200
    publication_lag_s: 0
    endpoint: https://services.swpc.noaa.gov/json/ovation_aurora_latest.json
    format: swpc_ovation_json
    notes: >
      臺灣位處低緯，極光本身無直接影響；有用的是極光橢圓赤道側邊界緯度——
      邊界越往低緯推進代表地磁擾動越深入，也是高緯 HF 與極區 GNSS 閃爍的判定依據。

  # ── 預報基準與環電流（48 小時預報引擎所需）─────────────────────────────
  - source_id: swpc_geomag_forecast
    name: NOAA SWPC 3-day geomagnetic forecast
    connector: forecast_sources
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: '3 日地磁預報'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [KP_3H]
    cadence_s: 43200
    latency_budget_s: 86400
    publication_lag_s: 0
    endpoint: https://services.swpc.noaa.gov/text/3-day-geomag-forecast.txt
    format: swpc_geomag_forecast_txt
    notes: >
      逐 3 小時 Kp 預報，涵蓋 72 小時。**本案 48 小時預報引擎的對照基準**——
      贏不過官方預報就沒有自建的理由，故必須同場比較而非只跟 persistence 比。

  - source_id: swpc_27day_outlook
    name: NOAA SWPC 27-day outlook
    connector: forecast_sources
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: '27 日太陽與地磁展望'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [F107_OBS, AP_AVG, KP_MAX_DAILY]
    cadence_s: 86400
    latency_budget_s: 172800
    publication_lag_s: 0
    endpoint: https://services.swpc.noaa.gov/text/27-day-outlook.txt
    format: swpc_27day_txt
    notes: 太陽自轉 27 天，冕洞高速流週期復現，是 24 小時以上 horizon 少數有物理依據的訊號。

  - source_id: kyoto_dst
    name: Kyoto WDC Dst index (real-time)
    connector: forecast_sources
    tier: 1
    attribution:
      provider: 'World Data Center for Geomagnetism, Kyoto（京都大學）'
      product: 'Dst 即時指數（暫定值 provisional）'
      url: 'https://wdc.kugi.kyoto-u.ac.jp/'
      terms: '學術使用免費；須依 WDC Kyoto 引用規範標註，並註明所用為暫定值'
    status: ready
    provides: [DST]
    cadence_s: 3600
    latency_budget_s: 7200
    publication_lag_s: 3600
    endpoint: https://wdc.kugi.kyoto-u.ac.jp/dst_realtime/presentmonth/index.html
    format: kyoto_dst_html
    notes: 逐時 Dst 即時值（euc-jp HTML）。歷史值需另接 final/provisional 檔。

  - source_id: cwa_swoo
    name: 中央氣象署太空天氣作業辦公室（在地實測）
    connector: cwa_swoo
    tier: 1
    attribution:
      provider: '交通部中央氣象署 太空天氣作業辦公室（SWOO）'
      product: 'TWTEC 為地震測報中心地面 GNSS 接收網（逾 100 站）反演；TWDI 為三分量磁力計水平總強度減寧靜基線後取各站中位數'
      url: 'https://swoo.cwa.gov.tw/'
      terms: '非公開 API。本案經成功大學合作管道取得中央氣象署授權後使用；第三方不得逕行取用，須另行取得授權。引用時須標註中央氣象署為資料產製者'
    status: ready
    provides: [TEC, DB_TW]
    cadence_s: 3600
    latency_budget_s: 86400
    publication_lag_s: 3600
    endpoint: https://swoo.cwa.gov.tw/json/SWInfo.json
    format: cwa_swoo_json
    # TAIWAN-CA 的中介憑證缺少 Subject Key Identifier，Python 3.12+ 的
    # VERIFY_X509_STRICT 會拒絕。**憑證鏈與主機名仍完整驗證**，僅放寬該項
    # 擴充欄位的一致性檢查。逐來源明示啟用，不設全域預設。
    tls_relaxed_strict: true
    notes: >
      **本案唯一的在地實測來源。** 這兩項填補了架構書列為 C2／C3「需機關協調」的核心缺口：
      GNSS_PNT 網域因此從「規則全部 unavailable」變成至少有一個可判定的實測參數。
      **待確認**：TWDI 的基線定義與時間解析度尚未與 CWA 核對
      （抓取當下 TWDI=-186 nT 而同檔 DST=-28、Kp=3.67 屬平靜），
      故暫不讓其驅動分級規則，見 docs/cwa_swoo_analysis.md。
      同一端點另含 kidx/DST/sws/XrayFx 等全球量，本案已有權威來源，刻意不取。

  - source_id: tacc_scn1c2
    name: 福衛七號掩星閃爍指數（TACC scn1c2）
    connector: tacc_scint
    tier: 1
    attribution:
      provider: 'TACC（Taiwan Analysis Center for COSMIC，交通部中央氣象署）／UCAR CDAAC'
      product: '福衛七號 TGRS 接收機星上運算之 S4 振幅閃爍指數（scn1c2），10 秒節奏，逐掩星事件。本案取臺灣周邊（18–28°N、116–126°E）並以 15 分鐘分箱取最大值'
      url: 'https://tacc.cwa.gov.tw/v2/download.html'
      terms: 'Release Memorandum（F7C2_SpWx_DataRelease_5.pdf）為技術性釋出說明，未見註冊要求或再散布限制；正式取用條款由合作夥伴（成功大學團隊）於兩年期計畫內確認。引用時須標註 TACC 與 UCAR CDAAC'
    status: ready
    provides: [S4]
    cadence_s: 900
    latency_budget_s: 172800
    publication_lag_s: 86400
    # 採 TDPC 而非 TROPS：兩者的 netCDF 結構不同，**只有 TDPC 版本含 RFI 指數**，
    # 而 memo 明載 RFI 會產生虛假 S4。TROPS 版無此欄位，無從篩檢。
    endpoint: https://tacc.cwa.gov.tw/data-service/fs7rt_tdpc/daily_tar/{date}/scn1c2_{date}.tar.gz
    format: tacc_scn1c2_tar
    # 與 cwa_swoo 同因：TAIWAN-CA 中介憑證缺 Subject Key Identifier，
    # Python 3.12+ 的 VERIFY_X509_STRICT 會拒絕。憑證鏈與主機名仍完整驗證。
    tls_relaxed_strict: true
    # 每日打包檔的產出時間不固定，往前試幾天再放棄
    lookback_days: 4
    notes: >
      **唯一能讓 GNSS-L3-SCINT 規則脫離 unavailable 的連續資料源。**
      單日打包檔約 72 MB（取代逐檔約 9,000–10,600 次請求），
      **因此排除於背景自動更新之外**，與 gfz_hp30、omni2_hourly 同樣改由手動或排程處理。
      **掩星幾何不是地面測站**：S4 取自臨邊射線切點附近，與 CWA SWOO 的地面站 S4
      不是同一種量，不可在同一條規則中混用門檻。
      **RFI 汙染會產生假的 S4**：Release Memo 載明權威的 RFI QC 旗標，
      但實測本產品的 netCDF 只有 RFI 指數、沒有該旗標；模組以未校準的保守門檻
      標 suspect 而非丟棄。**在取得該旗標前，本來源不應驅動分級規則**
      （configs/rules/ 暫不引用），與 CWA TWDI 同樣處理。
      詳見 docs/formosat7_tacc_analysis.md。

  - source_id: swpc_drap
    name: NOAA SWPC D-Region Absorption Prediction
    connector: forecast_sources
    tier: 1
    attribution:
      provider: 'NOAA/NWS Space Weather Prediction Center'
      product: 'D-Region Absorption Prediction（D-RAP）'
      url: 'https://services.swpc.noaa.gov/'
      terms: '美國政府公眾領域資料（U.S. Government work, public domain）'
    status: ready
    provides: [DRAP_MAX_MHZ, DRAP_TW_MHZ]
    cadence_s: 300
    latency_budget_s: 3600
    publication_lag_s: 300
    endpoint: https://services.swpc.noaa.gov/text/drap_global_frequencies.txt
    format: swpc_drap_txt
    notes: >
      D 層吸收最高受影響頻率格網。**架構書原將電離層產品列為 C2「需外部協調」，
      此來源證明其中的 HF 吸收部分現成可用**，可先支撐議題五的 HF 分項，
      並在台灣周邊取樣為區域指標。

  - source_id: omni2_hourly
    name: NASA OMNI2 hourly merged dataset
    connector: omni
    tier: 3                       # 參考／訓練用（事後重整，非即時）
    attribution:
      provider: 'NASA/GSFC Space Physics Data Facility（OMNIWeb）'
      product: 'OMNI2 逐時整合資料集。各參數的原始產製者不同：IMF 與太陽風為 ACE/Wind/IMP 等衛星，Kp/ap 為 GFZ，Dst 為 WDC Kyoto，F10.7 為加拿大 DRAO'
      url: 'https://omniweb.gsfc.nasa.gov/'
      terms: '公開；引用 King & Papitashvili (2005), JGR，並一併標註各原始產製者'
    status: ready
    provides: [KP_3H, AP_3H, DST, F107_OBS, SW_V, SW_N, IMF_BZ]
    cadence_s: 3600
    latency_budget_s: 7776000     # 90 天（事後重整資料，不適用即時性判定）
    publication_lag_s: 2592000    # 30 天：OMNI 為事後重整，回放時不可當即時可用
    endpoint: https://spdf.gsfc.nasa.gov/pub/data/omni/low_res_omni/omni2_{year}.dat
    format: omni2_hourly
    years: 8                      # 預設回填近 8 年
    notes: >
      IMF、太陽風、Kp、Dst、ap、F10.7 對齊到同一逐時軸，自 1963 年起，免認證。
      這是 48 小時預報引擎唯一可用的長期訓練資料來源——即時通道只保留數天，
      湊不出可訓練的樣本數。tier=3 表示它不參與即時判讀，只供訓練與回測。

  # ── 新建 C2/C3：需外部協調之來源 ───────────────────────────────────────
  - source_id: tw_gnss_tec
    name: 地基 GNSS 網 TEC/ROTI/S4
    connector: null
